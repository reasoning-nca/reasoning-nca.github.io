<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reasoning NCA: Maze Out-of-Distribution Demo</title>
  <link href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,700|Noto+Sans:400,500,600,700"
    rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script src="../swissgl.js"></script>
  <style>
    #demo,
    #demo.mood-layout {
      display: flex !important;
      flex-direction: column !important;
      gap: 16px;
      margin: 0 auto;
      padding: 16px 20px;
      box-sizing: border-box;
    }

    /* 1) First row: Step display */
    .step-counter {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      font-family: var(--font-mono, monospace);
      font-variant-numeric: tabular-nums;
    }

    /* 2) Second row: 2 parallel rollout cards (Trained 9x9 vs Test size) */
    .rollouts-row {
      display: grid;
      grid-template-columns: 1fr 3fr;
      align-items: center;
      gap: 20px;
      width: 100%;
      margin-bottom: 4px;
    }

    @media (max-width: 640px) {
      .rollouts-row {
        grid-template-columns: 1fr;
      }
    }

    .rollout-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-panel, #f8f9fa);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .rollout-card.train-card-wrap {
      width: 100%;
      max-width: 220px;
      margin: 0 auto;
      align-self: center;
    }

    .rollout-card.test-card-wrap {
      width: 100%;
    }

    /* Correct (matches target grid): green border */
    .rollout-card.correct {
      border-color: #008c33;
      box-shadow: 0 0 6px rgba(0, 140, 51, 0.35);
    }

    .rollout-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--text);
      gap: 8px;
    }

    .rollout-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      white-space: nowrap;
    }

    .rollout-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .select-dropdown {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: #eee;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 4px;
      padding: 3px 6px;
      cursor: pointer;
      outline: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .select-dropdown:hover {
      background: #e2e2e2;
      border-color: rgba(0, 0, 0, 0.35);
    }

    .select-dropdown:focus {
      border-color: steelblue;
    }

    .rollout-canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      cursor: grab;
      background-color: var(--bg-panel, #f8f9fa);
      image-rendering: pixelated;
    }

    /* 3 & 4) Demo controls */
    .demo-controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .demo-controls-wrapper .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }

    .demo-controls-wrapper .controls-row .speed {
      flex: 1;
      max-width: 220px;
      min-width: 110px;
    }

    .noise-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .canvas-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-secondary, #666);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 0px;
      display: inline-block;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body>
  <!-- SVG Icon Definitions -->
  <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <symbol id="playIcon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"></path>
    </symbol>
    <symbol id="pauseIcon" viewBox="0 0 24 24">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
    </symbol>
    <symbol id="resetIcon" viewBox="0 0 24 24">
      <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z">
      </path>
    </symbol>
    <symbol id="stepIcon" viewBox="0 0 24 24">
      <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
    </symbol>
    <symbol id="handIcon" viewBox="0 0 24 24">
      <path
        d="M10 9V5a1 1 0 0 1 2 0v4h1V3a1 1 0 0 1 2 0v6h1V4a1 1 0 0 1 2 0v7a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6v-2a1 1 0 0 1 2 0v1h1V6a1 1 0 0 1 2 0v3h2z" />
    </symbol>
    <symbol id="pointerIcon" viewBox="0 0 24 24">
      <path
        d="M19.98 14.82l-.63 4.46c-.14.99-.99 1.72-1.98 1.72h-6.16c-.53 0-1.29-.21-1.66-.59L5 15.62l.83-.84c.24-.24.58-.35.92-.28L10 15.24V4.5C10 3.67 10.67 3 11.5 3S13 3.67 13 4.5v6h.91c.31 0 .62.07.89.21l4.09 2.04c.77.39 1.21 1.22 1.09 2.07z" />
    </symbol>
  </svg>

  <div class="l-body-outset mood-layout" id="demo">
    <!-- 2) Second row: Two demo cards -->
    <div class="rollouts-row">
      <!-- (i) Trained on: 9x9 (1/4th width, centered, step on the right) -->
      <div class="rollout-card train-card-wrap" id="train-card">
        <div class="rollout-header">
          <span class="rollout-title">Trained on: 9x9</span>
          <div class="step-counter" id="step-count-train">Step: 0</div>
        </div>
        <canvas class="rollout-canvas" id="train-canvas" width="256" height="256"></canvas>
      </div>

      <!-- (ii) Test on: <dropdown selector 13x13 to 201x201, default 59x59> (3/4th width), step in between, legend on right -->
      <div class="rollout-card test-card-wrap" id="test-card">
        <div class="rollout-header">
          <div class="rollout-title">
            <span>Test on:</span>
            <select id="test-size-select" class="select-dropdown">
              <!-- Dynamically populated from 13x13 to 201x201 -->
            </select>
          </div>
          <div class="step-counter" id="step-count-test">Step: 0</div>
          <div class="canvas-legend">
            <span class="legend-item"><span class="color-dot" style="background: #000000;"></span>wall</span>
            <span class="legend-item"><span class="color-dot" style="background: #7f7f7f;"></span>empty</span>
            <span class="legend-item"><span class="color-dot" style="background: #e600e6;"></span>source/target</span>
          </div>
        </div>
        <canvas class="rollout-canvas" id="test-canvas" width="512" height="512"></canvas>
      </div>
    </div>

    <!-- 3 & 4) Demo controls -->
    <div class="demo-controls-wrapper">
      <!-- Row (i): play-pause, reset, step .... Speed .... "New Maze" -->
      <div class="controls-row">
        <div class="control-buttons">
          <span id="play-pause" class="icon-btn" title="Play/Pause (Space)">
            <svg class="demo-icon" id="play">
              <title>Play</title>
              <use xlink:href="#playIcon"></use>
            </svg>
            <svg class="demo-icon" id="pause" style="display: none;">
              <title>Pause</title>
              <use xlink:href="#pauseIcon"></use>
            </svg>
          </span>
          <span id="reset" class="icon-btn" title="Reset (R)">
            <svg class="demo-icon">
              <title>Reset</title>
              <use xlink:href="#resetIcon"></use>
            </svg>
          </span>
          <span id="step" class="icon-btn" title="Step (S)">
            <svg class="demo-icon">
              <title>Step</title>
              <use xlink:href="#stepIcon"></use>
            </svg>
          </span>
        </div>

        <div class="speed" title="Simulation Speed">
          <div class="slider-wrap">
            <input type="range" id="speed" min="1" max="120" step="1" value="60">
            <button type="button" class="slider-reset-btn" id="reset-speed" title="Reset to default">
              <svg>
                <use xlink:href="#resetIcon"></use>
              </svg>
            </button>
          </div>
          <span>Speed: <label id="speedLabel">60 steps/s</label></span>
        </div>

        <button class="btn-pill primary" id="new-maze" title="New Maze">
          New Maze
        </button>
      </div>

      <!-- Row (ii): Add Noise title, Noise Radius slider, Noise Std slider -->
      <div class="controls-row">
        <div class="noise-title">
          <span>Add Noise: </span>
        </div>

        <div class="speed" title="Noise Radius">
          <div class="slider-wrap">
            <input type="range" id="noise-radius" min="0" max="4" step="1" value="1">
            <button type="button" class="slider-reset-btn" id="reset-noise-radius" title="Reset to default">
              <svg>
                <use xlink:href="#resetIcon"></use>
              </svg>
            </button>
          </div>
          <span>Noise Radius: <label id="noiseRadiusLabel">3x3</label></span>
        </div>

        <div class="speed" title="Noise Std">
          <div class="slider-wrap">
            <input type="range" id="noise-std" min="0" max="1" step="0.05" value="0.3">
            <button type="button" class="slider-reset-btn" id="reset-noise-std" title="Reset to default">
              <svg>
                <use xlink:href="#resetIcon"></use>
              </svg>
            </button>
          </div>
          <span>Noise Std: <label id="noiseStdLabel">0.30</label></span>
        </div>
      </div>

      <div id="demo-tip">
        <svg>
          <use xlink:href="#pointerIcon"></use>
        </svg>
        <div class="hint" id="tip-text">Click or drag on any grid rollout to inject noise live.</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createDemoMood } from './create_demo.js';
    createDemoMood('demo');
  </script>
</body>

</html>
