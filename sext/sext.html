<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reasoning NCA: Sudoku-Extreme Demo</title>
  <link href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,700|Noto+Sans:400,500,600,700"
    rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script src="../swissgl.js"></script>
  <style>
    #demo-canvas {
      background-color: var(--bg-panel, #f8f9fa);
      cursor: pointer;
    }

    .brush-controls-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
    }

    .mode-group .group-label {
      font-size: 12px;
      font-weight: 500;
      padding: 0 6px 0 4px;
      color: var(--text);
      user-select: none;
    }
  </style>
</head>

<body>
  <!-- SVG Icon Definitions -->
  <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <symbol id="playIcon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"></path>
    </symbol>
    <symbol id="pauseIcon" viewBox="0 0 24 24">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
    </symbol>
    <symbol id="resetIcon" viewBox="0 0 24 24">
      <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z">
      </path>
    </symbol>
    <symbol id="stepIcon" viewBox="0 0 24 24">
      <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
    </symbol>
    <symbol id="pinIcon" viewBox="0 0 24 24">
      <path
        d="M16 9V4l1 0c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1l1 0v5c0 1.66-1.34 3-3 3v2h5.97v7l1.03 1 1.03-1v-7H19v-2c-1.66 0-3-1.34-3-3z" />
    </symbol>
    <symbol id="magnetIcon" viewBox="0 0 24 24">
      <path
        d="M3 7v6c0 4.97 4.03 9 9 9s9-4.03 9-9V7c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v6c0 1.1-.9 2-2 2s-2-.9-2-2V7c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2zm3-1h2v3H6V6zm10 0h2v3h-2V6z" />
    </symbol>
    <symbol id="pointerIcon" viewBox="0 0 24 24">
      <path
        d="M19.98 14.82l-.63 4.46c-.14.99-.99 1.72-1.98 1.72h-6.16c-.53 0-1.29-.21-1.66-.59L5 15.62l.83-.84c.24-.24.58-.35.92-.28L10 15.24V4.5C10 3.67 10.67 3 11.5 3S13 3.67 13 4.5v6h.91c.31 0 .62.07.89.21l4.09 2.04c.77.39 1.21 1.22 1.09 2.07z" />
    </symbol>
    <symbol id="chevronDown" viewBox="0 0 24 24">
      <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
    </symbol>
  </svg>

  <div class="l-body-outset grid" id="demo">
    <div class="canvas-column">
      <div class="canvas-header">
        <div class="step-counter" id="step-count">Step: 0</div>
        <div class="canvas-legend">
          <span class="legend-item"><span class="color-dot" style="background: #14141f;"></span>given</span>
          <span class="legend-item"><span class="color-dot" style="background: #008c33;"></span>correct</span>
          <span class="legend-item"><span class="color-dot" style="background: #d91f1f;"></span>incorrect</span>
        </div>
      </div>

      <canvas id="demo-canvas" width="512" height="512"></canvas>

      <div class="demo-controls">
        <div class="controls-row">
          <div class="control-buttons">
            <span id="play-pause" class="icon-btn" title="Play/Pause">
              <svg class="demo-icon" id="play">
                <title>Play</title>
                <use xlink:href="#playIcon"></use>
              </svg>
              <svg class="demo-icon" id="pause" style="display: none;">
                <title>Pause</title>
                <use xlink:href="#pauseIcon"></use>
              </svg>
            </span>
            <span id="reset" class="icon-btn" title="Reset">
              <svg class="demo-icon">
                <title>Reset</title>
                <use xlink:href="#resetIcon"></use>
              </svg>
            </span>
            <span id="step" class="icon-btn" title="Step">
              <svg class="demo-icon">
                <title>Step</title>
                <use xlink:href="#stepIcon"></use>
              </svg>
            </span>
          </div>

          <button class="btn-pill primary" id="new-sudoku" title="New Sudoku">
            New Sudoku
          </button>
        </div>

        <div class="sliders-row">
          <div class="speed" title="Simulation Speed">
            <div class="slider-wrap">
              <input type="range" id="speed" min="1" max="60" step="1" value="15">
              <button type="button" class="slider-reset-btn" id="reset-speed" title="Reset to default">
                <svg>
                  <use xlink:href="#resetIcon"></use>
                </svg>
              </button>
            </div>
            <span>Speed: <label id="speedLabel">15 steps/s</label></span>
          </div>

          <div class="speed" title="Cell Fire Rate">
            <div class="slider-wrap">
              <input type="range" id="fire-rate" min="0" max="1" step="0.05" value="0.8">
              <button type="button" class="slider-reset-btn" id="reset-fire-rate" title="Reset to default">
                <svg>
                  <use xlink:href="#resetIcon"></use>
                </svg>
              </button>
            </div>
            <span>Cell Fire Rate: <label id="fireRateLabel">0.80</label></span>
          </div>
        </div>

        <div class="brush-controls-row">
          <div class="mode-group" id="set_mode" title="Set cell state">
            <span class="group-label">Set to:</span>
            <label class="mode-btn active" title="Correct Digit">
              <input type="radio" name="set_mode" value="correct" checked>
              <span>Correct</span>
            </label>
            <label class="mode-btn" title="Random Vector">
              <input type="radio" name="set_mode" value="random">
              <span>Random</span>
            </label>
          </div>
        </div>
      </div>

      <div id="demo-tip">
        <svg>
          <use xlink:href="#pointerIcon"></use>
        </svg>
        <div class="hint">Click any cell to set it to the correct digit (random hidden) or random vector.
        </div>
      </div>
    </div>

    <div id="pattern-controls">
      <div class="pattern-selector-title">Difficulty</div>
      <div id="difficulty-shelf" class="pattern-selector">
        <!-- dynamically populated subcards "0-1", ... -->
      </div>

      <div class="plot-toggle-header" id="plot-toggle">
        <div class="pattern-selector-title" id="plot-toggle-title" style="margin-top: 0;">Hide #Violating Cells</div>
        <svg class="plot-toggle-icon expanded">
          <use xlink:href="#chevronDown"></use>
        </svg>
      </div>
      <div class="plot-container visible" id="plot-container">
        <canvas id="metric-plot"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { createDemoSext } from './create_demo.js';
    const canvas = document.getElementById('demo-canvas');
    const glsl = SwissGL(canvas);
    createDemoSext(glsl, 'demo');
  </script>
</body>

</html>
