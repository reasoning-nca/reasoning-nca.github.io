<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reasoning NCA: Maze Solving Demo</title>
  <link href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,700|Noto+Sans:400,500,600,700"
    rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script src="../swissgl.js"></script>
  <style>
    #demo-canvas {
      background-color: var(--bg-panel, #f8f9fa);
      cursor: default;
    }
  </style>
</head>

<body>
  <!-- SVG Icon Definitions -->
  <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <symbol id="playIcon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"></path>
    </symbol>
    <symbol id="pauseIcon" viewBox="0 0 24 24">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
    </symbol>
    <symbol id="resetIcon" viewBox="0 0 24 24">
      <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z">
      </path>
    </symbol>
    <symbol id="stepIcon" viewBox="0 0 24 24">
      <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
    </symbol>
    <symbol id="brushIcon" viewBox="0 0 24 24">
      <path
        d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z" />
    </symbol>
    <symbol id="handIcon" viewBox="0 0 24 24">
      <path
        d="M10 9V5a1 1 0 0 1 2 0v4h1V3a1 1 0 0 1 2 0v6h1V4a1 1 0 0 1 2 0v7a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6v-2a1 1 0 0 1 2 0v1h1V6a1 1 0 0 1 2 0v3h2z" />
    </symbol>
    <symbol id="pointerIcon" viewBox="0 0 24 24">
      <path
        d="M19.98 14.82l-.63 4.46c-.14.99-.99 1.72-1.98 1.72h-6.16c-.53 0-1.29-.21-1.66-.59L5 15.62l.83-.84c.24-.24.58-.35.92-.28L10 15.24V4.5C10 3.67 10.67 3 11.5 3S13 3.67 13 4.5v6h.91c.31 0 .62.07.89.21l4.09 2.04c.77.39 1.21 1.22 1.09 2.07z" />
    </symbol>
    <symbol id="chevronDown" viewBox="0 0 24 24">
      <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
    </symbol>
  </svg>

  <div class="l-body-outset grid" id="demo">
    <div class="canvas-column">
      <div class="canvas-header">
        <div class="step-counter" id="step-count">Step: 0</div>
        <div class="canvas-legend">
          <span class="legend-item"><span class="color-dot" style="background: #000000;"></span>wall</span>
          <span class="legend-item"><span class="color-dot" style="background: #7f7f7f;"></span>empty</span>
          <span class="legend-item"><span class="color-dot" style="background: #e600e6;"></span>source</span>
          <span class="legend-item"><span class="color-dot" style="background: #ff8c00;"></span>target</span>
        </div>
      </div>

      <canvas id="demo-canvas" width="512" height="512"></canvas>

      <div class="demo-controls">
        <div class="controls-row">
          <div class="control-buttons">
            <span id="play-pause" class="icon-btn" title="Play/Pause">
              <svg class="demo-icon" id="play">
                <title>Play</title>
                <use xlink:href="#playIcon"></use>
                <symbol id="chevronDown" viewBox="0 0 24 24">
                  <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                </symbol>
              </svg>
              <svg class="demo-icon" id="pause" style="display: none;">
                <title>Pause</title>
                <use xlink:href="#pauseIcon"></use>
                <symbol id="chevronDown" viewBox="0 0 24 24">
                  <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                </symbol>
              </svg>
            </span>
            <span id="reset" class="icon-btn" title="Reset">
              <svg class="demo-icon">
                <title>Reset</title>
                <use xlink:href="#resetIcon"></use>
                <symbol id="chevronDown" viewBox="0 0 24 24">
                  <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                </symbol>
              </svg>
            </span>
            <span id="step" class="icon-btn" title="Step">
              <svg class="demo-icon">
                <title>Step</title>
                <use xlink:href="#stepIcon"></use>
                <symbol id="chevronDown" viewBox="0 0 24 24">
                  <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                </symbol>
              </svg>
            </span>
          </div>

          <button class="btn-pill primary" id="new-maze" title="New Maze">
            New Maze
          </button>
        </div>

        <div class="sliders-row">
          <div class="speed" title="Simulation Speed">
            <div class="slider-wrap">
              <input type="range" id="speed" min="1" max="120" step="1" value="30">
              <button type="button" class="slider-reset-btn" id="reset-speed" title="Reset to default">
                <svg>
                  <use xlink:href="#resetIcon"></use>
                </svg>
              </button>
            </div>
            <span>Speed: <label id="speedLabel">30 steps/s</label></span>
          </div>

          <div class="speed" title="Cell Fire Rate">
            <div class="slider-wrap">
              <input type="range" id="fire-rate" min="0" max="1" step="0.05" value="0.8">
              <button type="button" class="slider-reset-btn" id="reset-fire-rate" title="Reset to default">
                <svg>
                  <use xlink:href="#resetIcon"></use>
                </svg>
              </button>
            </div>
            <span>Cell Fire Rate: <label id="fireRateLabel">0.80</label></span>
          </div>
        </div>

        <div class="brush-controls-row">
          <div id="brush_mode" class="mode-group">
            <label class="mode-btn active" title="Move">
              <input type="radio" name="brush_mode" value="move" checked>
              <svg>
                <use xlink:href="#handIcon"></use>
              </svg>
              <span>Move</span>
            </label>
            <label class="mode-btn" title="Draw">
              <input type="radio" name="brush_mode" value="draw">
              <svg>
                <use xlink:href="#brushIcon"></use>
              </svg>
              <span>Draw</span>
            </label>
          </div>

          <div id="brush_type" class="brush-group">
            <label class="brush-option active" title="Wall">
              <input type="radio" name="brush" value="wall" checked>
              <span class="color-dot" style="background: #000000;"></span>
              <span>Wall</span>
            </label>
            <label class="brush-option" title="Empty">
              <input type="radio" name="brush" value="empty">
              <span class="color-dot" style="background: #7f7f7f;"></span>
              <span>Empty</span>
            </label>
            <label class="brush-option" title="Source">
              <input type="radio" name="brush" value="source">
              <span class="color-dot" style="background: #e600e6;"></span>
              <span>Source</span>
            </label>
            <label class="brush-option" title="Target">
              <input type="radio" name="brush" value="target">
              <span class="color-dot" style="background: #ff8c00;"></span>
              <span>Target</span>
            </label>
          </div>
        </div>
      </div>

      <div id="demo-tip">
        <svg>
          <use xlink:href="#pointerIcon"></use>
        </svg>
        <div class="hint">Click and drag to move the maze start/end points, or to draw new walls live.</div>
      </div>
    </div>

    <div id="pattern-controls">
      <div class="pattern-selector-title">Variant</div>
      <div id="variant-shelf" class="pattern-selector">
        <div class="subcard active" data-variant="bfs">BFS</div>
        <div class="subcard" data-variant="astar">A*</div>
      </div>

      <div class="plot-toggle-header" id="plot-toggle">
        <div class="pattern-selector-title" id="plot-toggle-title" style="margin-top: 0;">Show Path Length</div>
        <svg class="plot-toggle-icon">
          <use xlink:href="#chevronDown"></use>
        </svg>
      </div>
      <div class="plot-container" id="plot-container">
        <canvas id="metric-plot"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { createDemoMhard } from './create_demo.js';
    const canvas = document.getElementById('demo-canvas');
    const glsl = SwissGL(canvas);
    createDemoMhard(glsl, 'demo');
  </script>
</body>

</html>
